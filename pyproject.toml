[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reliable-change"
version = "0.1.0"
description = "Reliability-Aware Missing-Modality SAR-Optical Change Detection for Rapid Disaster Damage Mapping"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2", "scikit-learn>=1.3", "matplotlib>=3.7", "pillow>=10"]

[project.scripts]
reliable-change = "reliable_change.cli:main"

[tool.setuptools.packages.find]
include = ["reliable_change*"]

[project.optional-dependencies]
image-metrics = ["lpips>=0.1.4", "pysodmetrics>=1.4"]
baselines = ["timm>=0.9", "fvcore>=0.1.5", "yacs>=0.1.8", "einops>=0.7", "pandas>=2"]
